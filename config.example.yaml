# wpkget configuration
# Default location: %APPDATA%\wpkget\config.yaml
# Override with: --config <path> or WPKGET_CONFIG env var

# Directory where binaries are installed.
# Defaults to %APPDATA%\wpkget\bin if not set.
bin_dir: "C:\\tools\\bin"

# zipdown service — leave empty to disable (future feature).
# When set, bare .exe assets are wrapped through the service before install.
zipdown_url: ""
zipdown_token: ""

# GitHub API token (optional): lifts the anonymous limit of 60 requests per hour.
# Read from the environment variable first, then from the pass entry (first line).
# github:
#   token_env: GITHUB_TOKEN     # default
#   token_pass: github/wpkget   # pass/winpass entry, see pass_cmd
# pass_cmd: winpass

# Only install releases that have been published for at least this long, to
# leave time to notice a compromised release. Go duration (48h, 90m); empty or 0
# disables it. Override per package in packages.yaml or per run with --min-age.
# min_release_age: 48h

# Generic proxy of https://github.com/ (e.g. an Artifactory generic remote).
# GitHub lookups and downloads go through it instead of api.github.com;
# downloads are not verified in this mode.
# github_remote: https://artifactory.example.com/artifactory/github-generic-remote

# When a release has both a .zip and another format (e.g. a bare .exe), use the .zip.
# Can be overridden per package in packages.yaml (prefer_zip: true|false).
# prefer_zip: true
