# wpkget package list
# Managed automatically by wpkget. Location: %APPDATA%\wpkget\packages.yaml
# You can edit this file manually — wpkget will respect binary_name on next update.

packages:
  - repo: junegunn/fzf
    version: "0.57.0"
    # binary_name omitted → installed as fzf.exe

  - repo: cli/cli
    version: "2.68.1"
    binary_name: gh   # installed as gh.exe instead of cli.exe

  - repo: BurntSushi/ripgrep
    version: "14.1.1"
    binary_name: rg   # installed as rg.exe

  # min_release_age overrides the global setting for one package ("0" disables it):
  # - repo: someuser/sometool
  #   version: "1.0.0"
  #   min_release_age: 168h   # wait a week before updating this one

  # prefer_zip overrides the global setting for one package:
  # - repo: someuser/sometool
  #   version: "1.0.0"
  #   prefer_zip: false
