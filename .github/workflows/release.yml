name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o wpkget_${{ matrix.goos }}_${{ matrix.goarch }}${EXT} \
            ./src/cmd/wpkget/

      - name: Package
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          BINARY="wpkget_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "wpkget_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "${BINARY}"
          else
            tar czf "wpkget_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "${BINARY}"
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          BINARY="wpkget_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="wpkget_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          else
            ARCHIVE="wpkget_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          fi
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload ${{ github.ref_name }} \
            "${BINARY}" "${ARCHIVE}" \
            --clobber
